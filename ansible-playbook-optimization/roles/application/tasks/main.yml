---
- name: Create application directory
  file:
    path: /tmp/application
    state: directory
    mode: '0755'

- name: Deploy optimized application
  copy:
    content: |
      <?php
      echo "Optimized application deployment";
      ?>
    dest: /tmp/application/index.php

- name: Simulate optimized deployment
  debug:
    msg: "Application deployed with modular optimization"
