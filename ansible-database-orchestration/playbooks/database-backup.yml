---
- name: Configure Database Backups
  hosts: database_servers
  become: yes
  vars:
    backup_dir: /opt/database-backups

  tasks:
    - name: Create backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install cron package on RHEL/CentOS
      dnf:
        name: cronie
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install cron package on Debian/Ubuntu
      apt:
        name: cron
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Start and enable cron service on RHEL/CentOS
      systemd:
        name: crond
        state: started
        enabled: yes
      when: ansible_os_family == "RedHat"

    - name: Start and enable cron service on Debian/Ubuntu
      systemd:
        name: cron
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

- name: Configure MySQL Backups
  hosts: mysql_servers
  become: yes
  vars:
    backup_dir: /opt/database-backups

  tasks:
    - name: Create MySQL backup script
      copy:
        content: |
          #!/bin/bash
          BACKUP_DIR="{{ backup_dir }}"
          DATE=$(date +%Y%m%d_%H%M%S)

          mkdir -p $BACKUP_DIR

          mysqldump --all-databases > $BACKUP_DIR/mysql_backup_$DATE.sql

          gzip $BACKUP_DIR/mysql_backup_$DATE.sql

          find $BACKUP_DIR -name "mysql_backup_*.sql.gz" -mtime +7 -delete

          echo "MySQL backup completed"
        dest: /usr/local/bin/mysql-backup.sh
        mode: '0755'

    - name: Schedule MySQL backup cron
      cron:
        name: "MySQL Daily Backup"
        minute: "0"
        hour: "2"
        job: "/usr/local/bin/mysql-backup.sh >> /var/log/mysql-backup.log 2>&1"

- name: Configure PostgreSQL Backups
  hosts: postgresql_servers
  become: yes

  tasks:
    - name: Create PostgreSQL backup script
      copy:
        content: |
          #!/bin/bash
          BACKUP_DIR="/opt/database-backups"
          DATE=$(date +%Y%m%d_%H%M%S)

          mkdir -p $BACKUP_DIR

          sudo -u postgres pg_dumpall > $BACKUP_DIR/postgresql_backup_$DATE.sql

          gzip $BACKUP_DIR/postgresql_backup_$DATE.sql

          find $BACKUP_DIR -name "postgresql_backup_*.sql.gz" -mtime +7 -delete

          echo "PostgreSQL backup completed"
        dest: /usr/local/bin/postgresql-backup.sh
        mode: '0755'

    - name: Schedule PostgreSQL backup cron
      cron:
        name: "PostgreSQL Daily Backup"
        minute: "0"
        hour: "3"
        job: "/usr/local/bin/postgresql-backup.sh >> /var/log/postgresql-backup.log 2>&1"
